services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_clone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n_clone
      POSTGRES_PASSWORD: n8n_clone
      POSTGRES_DB: n8n_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_clone"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: n8n_clone_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
